# HostVigil Sample Configuration
# Copy this to config.yaml and customize for your network

hostvigil:
  discovery:
    # START SMALL - test with one subnet first!
    target_ranges:
      - "192.168.1.0/24"    # Test subnet
      - "192.168.100.0/24"  # Server VLAN (optional)

    wave_enabled: true
    wave_size: 500

  scanner:
    mode: two_phase  # nmap_only or two_phase

    naabu:
      rate: 5000
      threads: 50

    nmap:
      phase2_only: true
      version_detection: true
      os_detection: true

  nuclei:
    auto_run: true
    run_on_web_hosts: true
    severity_filter: ["critical", "high"]

  dashboard:
    host: "127.0.0.1"
    port: 5000

  database:
    path: "data/hostvigil.db"

  # Optional: SpearSpray backend for AD/Kerberos credential auditing.
  # Leave backend as 'native' unless you have SpearSpray installed and configured.
  credential_spray:
    backend: native                # native | spearspray
    # Uncomment and fill in to enable SpearSpray:
    # backend: spearspray
    # spearspray:
    #   binary_path: spearspray
    #   domain: corp.example.com
    #   username: userlist.txt
    #   password: passwords.txt
    #   domain_controller: 10.0.0.1
    #   use_ssl: false
    #   threads: 5
    #   threshold: 2
    #   jitter: '3,5'

pipeline:
  mode: wave
  wave_size: 500
  nuclei_on_web_discovery: true
